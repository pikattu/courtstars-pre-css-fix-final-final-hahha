apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: courtstars-app-hpa
  namespace: courtstars
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: courtstars-app
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
